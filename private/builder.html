<style>
/* Layout: toolbar on top, pannable node canvas left, inspector / hand panel right (stacked on phones).
   Single committed dark look: a vestry at night, candle-gold tokens on violet-black. */
:root {
  --ground: var(--bg, #0b0b0c); --surface: var(--bg2, #151517);
  --surface-2: color-mix(in srgb, var(--bg2, #151517) 86%, var(--fg, #d0d0d3));
  --text: var(--fg, #d0d0d3); --muted: var(--dim, #85858b);
  --gold: var(--candle, #86a35f); --gold-dim: color-mix(in srgb, var(--candle, #86a35f) 45%, var(--bg, #0b0b0c));
  --root: var(--candle, #86a35f);
  --ember: #c4574a; --bad: #e07a6a;
  --action: #7fb4de; --spell: #d17c9e; --passive: #82c79f;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--ground); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-block: 0 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { display: flex; flex-direction: column; gap: 12px; min-height: 100%; max-width: 1500px; margin: 0 auto; padding-top: var(--gap-app); }
body > .sac-nav { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand small { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.brand .ttl { margin: 2px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 36px); letter-spacing: .02em; }
.brand input { font-family: var(--display); font-size: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; color: var(--text); padding: 6px 10px; width: min(100%, 360px); letter-spacing: .02em; margin-top: 4px; }
.brand input:focus { border-color: var(--gold); outline: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.field { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.field input[type=number] { width: 58px; }
input[type=number], input[type=text], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; color: var(--text);
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 7px 16px; cursor: pointer; font-family: var(--mono); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--gold); color: #1a1405; }
.btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 15px; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; flex: 1; min-height: 0; }
.stage { position: relative; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; min-height: 460px; height: calc(100vh - 150px - var(--navh, 0px)); max-height: 900px; }
.stage#cardView { overflow: auto; padding: 14px; height: auto; max-height: none; }
.cvbar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; position: sticky; top: -14px; background: var(--surface); padding: 8px 0; z-index: 2; }
.cvbar input[type=search] { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; min-width: 200px; font: inherit; }
.cvtypes { display: flex; gap: 6px; }
.cvtypes button { background: var(--surface-2); border: 1px solid var(--line); color: var(--text); border-radius: 4px; padding: 6px 10px; cursor: pointer; font: 14px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.cvtypes button[aria-pressed=true] { border-color: var(--gold); color: var(--gold); }
.cvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.cvgrid h3 { grid-column: 1 / -1; margin: 12px 0 0; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--gold); }
.ncard { text-align: left; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 5px; padding: 11px 13px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 5px; min-height: 130px; transition: transform .12s, border-color .12s; }
.ncard:hover, .ncard:focus-visible { transform: translateY(-2px); border-color: var(--c); }
.ncard.sel { outline: 2px solid var(--gold); }
.ncard .ty { font: 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted, #9a96a3); }
.ncard .nm { font-family: var(--display); font-size: 21px; line-height: 1.1; }
.ncard .st { font-size: 15px; color: var(--gold); display: flex; gap: 10px; flex-wrap: wrap; }
.ncard .ds { font-size: 15px; color: var(--muted, #9a96a3); line-height: 1.4; }
.ncard .rq { font-size: 14px; color: var(--muted, #9a96a3); font-style: italic; }
.grid-line { stroke: var(--surface-2); stroke-width: 1; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.edge.temp { stroke: var(--gold); stroke-dasharray: 5 5; }
.node { cursor: pointer; }
.node rect.card { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; }
.node.sel rect.card { stroke: var(--gold); stroke-width: 2.5; }
.node text { fill: var(--text); pointer-events: none; }
.node .nm { font-family: var(--display); font-size: 17px; }
.node .ty { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.node .free { font-family: var(--mono); font-size: 12px; fill: var(--muted); }
.node .pts { font-family: var(--mono); font-size: 12px; fill: var(--muted); text-anchor: end; }
.node .hz { font-family: var(--mono); font-size: 12px; fill: var(--ember); text-anchor: end; }
.hzdot { fill: var(--ember); stroke: #1a0a05; stroke-width: 1; }
.pip { fill: var(--gold); stroke: #1a1405; stroke-width: 1; }
.port { fill: var(--ground); stroke: var(--gold-dim); stroke-width: 2; cursor: crosshair; }
.port:hover { stroke: var(--gold); fill: var(--gold-dim); }
.port-in { fill: var(--ground); stroke: var(--line); stroke-width: 2; pointer-events: none; }
.hint { position: absolute; left: 10px; bottom: 8px; font-family: var(--mono); font-size: 13px; color: var(--muted); background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 3px 8px; border-radius: 4px; max-width: calc(100% - 140px); }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom .btn { padding: 4px 10px; }

.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-box { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-box h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .03em; }
.card-box h3 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > label { flex: 1 1 90px; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row > label input, .row > label select { width: 100%; text-transform: none; letter-spacing: 0; font-family: var(--body); font-size: 16px; }
textarea { width: 100%; min-height: 150px; resize: vertical; font-size: 15px; }
textarea[data-f] { background: var(--surface-2); }
.check { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.parents { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 15px; background: var(--surface-2); }
.chip button { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 6px; }
.chip button:hover { color: var(--bad); }
.muted { color: var(--muted); font-size: 15px; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; font-size: 15px; }
.stats b { font-family: var(--mono); font-weight: 500; color: var(--gold); }

.status { font-family: var(--mono); font-size: 14px; color: var(--muted); min-height: 18px; }
details summary { cursor: pointer; font-family: var(--mono); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; min-height: 380px; }
}
@media (prefers-reduced-motion: no-preference) {
  .edge { transition: all .2s; }
}
#gearView input, #gearView select { background: var(--surface-2); border: 1px solid var(--line); }
@media (max-width: 700px) { .hint { display: none; } }
.backlist { display: none; align-self: flex-start; }
@media (max-width: 900px) { .backlist { display: inline-block; } }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <small>Sacrament</small>
      <h1 class="ttl">Node builder</h1>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Mode">
        <button id="mEdit" aria-pressed="true">Build</button>
        <button id="mGear" aria-pressed="false">Gear</button>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="stage" id="cardView">
      <div class="cvbar">
        <input type="search" id="cvSearch" placeholder="Search nodes" aria-label="Search nodes">
        <div class="cvtypes" id="cvTypes" role="group" aria-label="Types"></div>
        <label class="field" for="cvSort">Group by <select id="cvSort"><option value="path">Path</option><option value="level">Level</option><option value="type">Type</option></select></label>
        <span class="cvadd" id="cvAdd"></span>
      </div>
      <div class="cvgrid" id="cvGrid"></div>
    </div>
    <div class="stage" id="gearView" hidden style="overflow:auto;height:auto;max-height:none;min-height:460px;padding:18px"></div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>

    var h = '', last = null;
    list.forEach(function (n) {
      var k = key(n); if (k !== last) { h += '<h3>' + esc(k) + '</h3>'; last = k; }
      var t = TYPES[n.type], stats = [];
      if (n.type !== 'passive') stats.push(RULES.USES[RULES.useOf(n)] || ''); if (isMagic(n)) stats.push('Looming +' + horrorDice(n)); if (n.heal) stats.push('Heals');
      if (n.level > 1) stats.push('Lv ' + n.level); if (n.innate) stats.push('innate');
      if (n.stat && n.bonus) stats.push('+' + n.bonus + ' ' + (ALIAS[n.stat] || n.stat)); var sa = n.type === 'spell' && spellAtk(n); if (sa) stats.push('Attack: ' + sa.stat);
      var req = parentsOf(n.id).map(function (id) { var q = byId(id); return q ? q.name : ''; }).filter(Boolean);
      h += '<button class="ncard' + (sel === n.id ? ' sel' : '') + '" data-card="' + n.id + '" style="--c:' + t.color + '">' +
        '<span class="ty">' + t.label + (n.path ? ' \u00b7 ' + esc(n.path) : '') + '</span><span class="nm">' + esc(n.name) + '</span>' +
        (stats.length ? '<span class="st">' + stats.map(esc).join('<span>\u00b7</span>') + '</span>' : '') +
        (req.length ? '<span class="rq">Needs ' + esc(req.join(' or ')) + '</span>' : '') + (n.desc ? '<span class="ds">' + esc(clip(n.desc, 150)) + '</span>' : '') + '</button>';
    });
    $('cvGrid').innerHTML = h || '<p style="grid-column:1/-1">No nodes match.</p>';
  }
  $('cvSearch').oninput = function () { cv.q = this.value.trim().toLowerCase(); renderCards(); };
  $('cvSort').onchange = function () { cv.sort = this.value; renderCards(); };
  $('cvTypes').onclick = function (e) { var b = e.target.closest('[data-ty]'); if (b) { cv.type = b.getAttribute('data-ty'); renderCards(); } };
  $('cvAdd').onclick = function (e) { var b = e.target.closest('[data-addc]'); if (b) addNode(b.getAttribute('data-addc')); };
  $('cvGrid').onclick = function (e) {
    var b = e.target.closest('[data-card]'); if (!b) return; var id = b.getAttribute('data-card');
    sel = id; renderCards(); renderPanel(); showPanel();
  };
  function sync() {
    $('mEdit').setAttribute('aria-pressed', S.mode === 'edit'); $('mGear').setAttribute('aria-pressed', S.mode === 'gear');
    var gear = S.mode === 'gear';
    $('cardView').hidden = gear; $('gearView').hidden = !gear;
    if (gear) { renderGearView(); renderPanel(); return; }
    renderPanel(); renderCards();
  }
  function setMode(m) { S.mode = m; if (m !== 'edit') sel = null; sync(); save(); }
  $('mEdit').onclick = function () { setMode('edit'); };
  $('mGear').onclick = function () { setMode('gear'); };

  sync();
})();
</script>
</body>
</html>
