# The public site is the "site" folder. Everything else in the repo is never published.
[build]
  publish = "site"
  # Packs private/builder.html into the password-gated builder function, and builds the canonical news blog from content/landing/blog.
  command = "node scripts/build-private.mjs && node scripts/build-landing.mjs"

[build.environment]
  # @netlify/blobs 11 (used by the builder, the node library and the Sacrament RPG table) needs Node 22.12 or later.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# The Netlify address and www go to the real address. This is a fallback for when the primary-domain setting does not do it.
[[redirects]]
  from = "https://sacramentrpg.netlify.app/*"
  to = "https://playsacrament.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.playsacrament.com/*"
  to = "https://playsacrament.com/:splat"
  status = 301
  force = true

# Old addresses. The earlier "Looming Horror" table (/play/) and its older addresses (/table, /tools) were retired: they all go to the home page.
# The first rule keeps the stone picture that earlier saved tables use as their background working (it moved to /vtt/).
[[redirects]]
  from = "/play/tiles/stone.webp"
  to = "/vtt/stone.webp"
  status = 301

[[redirects]]
  from = "/play"
  to = "/"
  status = 301

[[redirects]]
  from = "/play/"
  to = "/"
  status = 301

[[redirects]]
  from = "/play/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/table"
  to = "/"
  status = 301

[[redirects]]
  from = "/table/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/tools"
  to = "/"
  status = 301

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 301

# The private inventory page (/inventory/) is for the owner only: it is not linked, not in the sitemap, and search engines are told to keep it out.
[[headers]]
  for = "/inventory/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/inventory"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# The playtest sign-up was removed from the home page; its thank-you page goes to the home page.
[[redirects]]
  from = "/thanks"
  to = "/"
